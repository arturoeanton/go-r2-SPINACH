<rect x="70" y="340" width="430" height="180" rx="16" fill="#173b32"/><text x="95" y="377" font-size="12" letter-spacing="2" fill="#b7d29f">SPINACH LAB / GO</text><text x="95" y="412" font-size="24" fill="white" font-weight="600">Exploration orchestrator</text><text x="95" y="445" font-size="14" fill="#cadbc1">Graph repository · navigation model · language model</text><text x="95" y="471" font-size="14" fill="#cadbc1">Search → explore → query → observe → answer</text><text x="95" y="497" font-size="12" fill="#96b78a">Tool observations are rebuilt from actual graph data.</text>
<rect x="605" y="190" width="340" height="130" rx="16" fill="#eef4e4" stroke="#cdddb9"/><text x="628" y="224" font-size="12" letter-spacing="2" fill="#789858">OUR NAVIGATION EXPERIMENT</text><text x="628" y="258" font-size="24" font-weight="600">Jev · TypeSafe API</text><text x="628" y="286" font-size="14" fill="#78906a">Rank subgraphs when enabled</text><text x="628" y="306" font-size="12" fill="#91a67f">HTTPS /systemone · option scores</text>
<rect x="1005" y="190" width="365" height="130" rx="16" fill="#f3eef8" stroke="#e3d9ee"/><text x="1028" y="224" font-size="12" letter-spacing="2" fill="#9a83b4">API GENERATION</text><text x="1028" y="258" font-size="24" font-weight="600">OpenAI · Responses API</text><text x="1028" y="286" font-size="14" fill="#9480aa">Propose actions · summarize evidence</text><text x="1028" y="306" font-size="12" fill="#a897b7">Server-selected model · Sol in demo</text>
<text x="605" y="355" font-size="13" fill="#526b49">Server environment / .env → Go API adapters · keys never sent to the browser</text>
<rect x="70" y="590" width="430" height="145" rx="16" fill="white" stroke="#dfe7d9"/><text x="95" y="624" font-size="12" letter-spacing="2" fill="#93a480">APPLICATION PERSISTENCE</text><text x="95" y="659" font-size="24" font-weight="600">SQLite repository</text><text x="95" y="689" font-size="14" fill="#819278">Graphs · positions · subgraphs · examples</text><text x="95" y="714" font-size="13" fill="#94a187">Revisions · upload registry · last-reference cleanup</text>
<rect x="605" y="390" width="765" height="490" rx="20" fill="white" stroke="#cbdcc0" stroke-width="2"/><text x="635" y="430" font-size="12" letter-spacing="2" fill="#789858">SPARQLITE / INDEPENDENT GO MODULE</text><text x="635" y="466" font-size="25" font-weight="600">Virtual RDF over existing SQLite</text><text x="635" y="494" font-size="14" fill="#819278">In-process library or standalone HTTP server on localhost:8091</text>
<rect x="635" y="525" width="705" height="82" rx="12" fill="#f4f7ed"/><text x="657" y="554" font-size="17" font-weight="600">Inspect → map → parse → plan</text><text x="657" y="580" font-size="13" fill="#899b7a">Tables · runtime types · keys · declared relationships · schema version</text>
<g stroke="#78927d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M987 607V635H804V660"/><path d="M987 635H1170V660"/><path d="M804 780V820H987V835"/><path d="M1170 780V820H987"/></g>
<rect x="635" y="660" width="338" height="120" rx="12" fill="#edf4e4" stroke="#d9e6c9"/><text x="657" y="695" font-size="20" font-weight="600">SQL pushdown</text><text x="657" y="723" font-size="13" fill="#78906a">Eligible BGP joins → one SQL statement</text><text x="657" y="748" font-size="12" fill="#8fa17f">Parameterized values · physical key joins</text><text x="657" y="768" font-size="12" fill="#8fa17f">Generated SQL + SQLite query plan</text>
<rect x="1000" y="660" width="340" height="120" rx="12" fill="#eff4f8" stroke="#dce6ee"/><text x="1022" y="695" font-size="20" font-weight="600">SPARQL evaluator</text><text x="1022" y="723" font-size="13" fill="#7890a1">Other supported algebra via goRDFlib</text><text x="1022" y="748" font-size="12" fill="#90a2ad">Lazy triple-pattern SQL lookups</text><text x="1022" y="768" font-size="12" fill="#90a2ad">No complete RDF materialization</text>
<text x="635" y="855" font-size="13" fill="#819278">One consistent read transaction · typed RDF results · explicit limits</text>
<rect x="605" y="930" width="765" height="100" rx="16" fill="#173b32"/><text x="630" y="967" font-size="23" font-weight="600" fill="white">Existing SQLite database · read-only</text><text x="630" y="997" font-size="14" fill="#bdd2ad">Lab: uploaded snapshot · gateway: original file · no RDF materialization.</text>
<rect x="70" y="790" width="430" height="240" rx="16" fill="#f8f1e5" stroke="#ebdfc9"/><text x="95" y="825" font-size="12" letter-spacing="2" fill="#b39a6e">TWO IMPORTANT BOUNDARIES</text><text x="95" y="861" font-size="18" font-weight="600">Native RDF mode is separate</text><text x="95" y="889" font-size="13" fill="#9e8d6e">An optional SQLite RDF store delegates Query,</text><text x="95" y="910" font-size="13" fill="#9e8d6e">Update and Graph Store to goRDFlib.</text><text x="95" y="948" font-size="18" font-weight="600">Conformance remains a release gate</text><text x="95" y="976" font-size="13" fill="#9e8d6e">Known W3C failures and unsupported SERVICE</text><text x="95" y="997" font-size="13" fill="#9e8d6e">are recorded in the validation report.</text>
<text x="70" y="1100" font-size="13" fill="#8c9c80">Fictional teaching graphs · Jev + OpenAI APIs · No measured end-to-end speedup claimed</text><text x="1370" y="1100" text-anchor="end" font-size="13" fill="#8c9c80">go-r2-SPINACH</text>
</g></svg>