<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">SPINACH Lab and SPARQLite architecture</title><desc id="desc">A visual frontend talks to the Go laboratory, which optionally uses the Jev API for navigation and the OpenAI API for actions. Application graphs are stored in SQLite. The independent SPARQLite module maps existing SQLite databases to virtual RDF and uses direct SQL or a lazy Go evaluator.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#78927d"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#e1e8df"/></pattern></defs>
<rect width="1440" height="1160" fill="#f7f9f5"/><rect width="1440" height="1160" fill="url(#grid)"/>
<g font-family="Inter,Arial,sans-serif" fill="#244334"><text x="70" y="58" font-size="12" letter-spacing="3" fill="#8a9e79">ONE EXPERIENCE. TWO REUSABLE PARTS.</text><text x="70" y="110" font-size="38" font-weight="650">SPINACH Lab × SPARQLite</text><text x="70" y="145" font-size="17" fill="#81927b">Observe the navigation. Inspect the query. Verify the result.</text>
<g stroke="#78927d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M280 290V340"/><path d="M500 380H550V248H605"/><path d="M500 420H575V165H1187V190"/><path d="M500 468H605"/><path d="M280 520V590"/><path d="M950 880V930"/></g>
